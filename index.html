<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bumi Kelapa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
#bgVideo {
  position: fixed;
  top: 90px;
  left: 0;
  width: 100%;
  height: calc(100% - 90px);
  object-fit: cover;
  z-index: -1;
}
</style>

</head>

<body class="beranda">

<video id="bgVideo" autoplay muted loop playsinline>
<source src="video/kelapa.mp4" type="video/mp4">
</video>

<button id="soundBtn">🔊 Aktifkan Suara</button>

<div class="overlay"></div>


<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 90px; overflow: visible;">

  <div style="display: flex; align-items: center;">
    <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 180px; width: auto; object-fit: contain; margin-top: 3px;">
  </div>
</header>


<div class="hero"></div>

<a href="produk.html" class="btn">Lihat Produk</a>

<footer>
<p>© 2026 Bumi Kelapa</p>
</footer>

<script>

const video = document.getElementById("bgVideo");
const btn = document.getElementById("soundBtn");

btn.addEventListener("click", function(){

if(video.muted){

video.muted = false;
video.volume = 1;
btn.innerText = "🔈 Matikan Suara";

}else{

video.muted = true;
btn.innerText = "🔊 Aktifkan Suara";

}

});


</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Bumi Kelapa</title>
<link rel="stylesheet" href="style.css">
<style>
.login-wrapper {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #f8faf8;
}
.login-box {
  background: white;
  border-radius: 20px;
  padding: 36px 32px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}
.login-logo {
  text-align: center;
  margin-bottom: 24px;
}
.login-logo img { height: 60px; }
.login-title {
  font-size: 20px;
  font-weight: 800;
  color: #1a3a1a;
  text-align: center;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: #999;
  text-align: center;
  margin-bottom: 24px;
}
.login-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #e0ede0;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  box-sizing: border-box;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: #2d6a2d; }
.login-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #2d6a2d, #1a3a1a);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-top: 4px;
  transition: opacity 0.2s;
}
.login-btn:hover { opacity: 0.9; }
.login-info {
  font-size: 12px;
  color: #888;
  text-align: center;
  margin-top: 14px;
  line-height: 1.6;
}
.login-err {
  background: #fff0f0;
  border: 1px solid #ffcccc;
  color: #cc0000;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
#fieldNama { display: none; }
</style>
</head>
<body>

<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); padding: 14px 24px; display: flex; align-items: center; justify-content: center; min-height: 70px;">
  <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 55px; width: auto; object-fit: contain;">
</header>

<nav>
  <a href="index.html">Beranda</a>
  <a href="produk.html">Produk</a>
  <a href="galeri.html">Galeri</a>
  <a href="tentang.html">Tentang Kami</a>
  <a href="kontak.html">Kontak</a>
</nav>

<div class="login-wrapper">
  <div class="login-box">
    <div class="login-logo">
      <img src="logo/NEW.png" alt="Bumi Kelapa">
    </div>
    <div class="login-title">Masuk / Daftar</div>
    <div class="login-sub">Masukkan nomor HP untuk melanjutkan</div>

    <div class="login-err" id="loginErr"></div>

    <div id="fieldNama">
      <input class="login-input" type="text" id="inputNama" placeholder="Nama lengkap Anda">
    </div>
    <input class="login-input" type="tel" id="inputHp" placeholder="Nomor HP (contoh: 081234567890)">
    <button class="login-btn" onclick="prosesLogin()">Lanjutkan</button>

    <div class="login-info">
      Nomor HP yang sudah terdaftar akan langsung masuk.<br>
      Nomor baru akan dibuatkan akun otomatis.
    </div>
  </div>
</div>

<script>
let tahap = 1; // 1=masukkan HP, 2=masukkan nama (jika baru)

async function prosesLogin() {
  const hp   = document.getElementById('inputHp').value.trim();
  const nama = document.getElementById('inputNama').value.trim();
  const err  = document.getElementById('loginErr');

  if (!hp) { tampilErr('Nomor HP wajib diisi.'); return; }
  if (tahap === 2 && !nama) { tampilErr('Nama wajib diisi.'); return; }

  err.style.display = 'none';

  try {
    const res  = await fetch('auth.php?aksi=login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ hp, nama })
    });
    const data = await res.json();

    if (data.sukses) {
      // Simpan ke localStorage
      localStorage.setItem('bk_user', JSON.stringify(data.user));
      // Redirect ke halaman sebelumnya atau produk
      const redirect = localStorage.getItem('bk_redirect') || 'produk.html';
      localStorage.removeItem('bk_redirect');
      window.location.href = redirect;
    } else {
      tampilErr(data.pesan);
    }
  } catch(e) {
    tampilErr('Gagal menghubungi server.');
  }
}

function tampilErr(pesan) {
  const err = document.getElementById('loginErr');
  err.textContent = pesan;
  err.style.display = 'block';
}

document.getElementById('inputHp').addEventListener('keydown', e => {
  if (e.key === 'Enter') prosesLogin();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - Bumi Kelapa</title>
<link rel="stylesheet" href="style.css">
<style>
.profil-wrapper {
  max-width: 500px;
  margin: 40px auto;
  padding: 0 16px;
}
.profil-card {
  background: white;
  border-radius: 20px;
  padding: 28px 24px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  margin-bottom: 16px;
}
.profil-avatar {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #2d6a2d, #c8b87a);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800; color: white;
  margin: 0 auto 16px;
}
.profil-nama {
  font-size: 18px; font-weight: 800;
  color: #1a3a1a; text-align: center; margin-bottom: 4px;
}
.profil-hp {
  font-size: 13px; color: #888;
  text-align: center; margin-bottom: 20px;
}
.profil-input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid #e0ede0; border-radius: 10px;
  font-size: 14px; font-family: inherit; outline: none;
  box-sizing: border-box; margin-bottom: 10px;
  transition: border-color 0.2s;
}
.profil-input:focus { border-color: #2d6a2d; }
.profil-label {
  font-size: 12px; font-weight: 600;
  color: #555; margin-bottom: 4px; display: block;
}
.profil-btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #2d6a2d, #1a3a1a);
  color: white; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  margin-top: 4px; transition: opacity 0.2s;
}
.profil-btn:hover { opacity: 0.9; }
.profil-btn-logout {
  width: 100%; padding: 12px;
  background: white; color: #cc0000;
  border: 1.5px solid #ffcccc; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  margin-top: 8px;
}
.sukses-msg {
  background: #f0fdf6; border: 1px solid #6ee7b7;
  color: #065f46; padding: 10px 14px;
  border-radius: 8px; font-size: 13px;
  margin-bottom: 12px; display: none;
}
</style>
</head>
<body>

<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); padding: 14px 24px; display: flex; align-items: center; justify-content: center; min-height: 70px;">
  <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 55px; width: auto; object-fit: contain;">
</header>

<nav>
  <a href="index.html">Beranda</a>
  <a href="produk.html">Produk</a>
  <a href="galeri.html">Galeri</a>
  <a href="tentang.html">Tentang Kami</a>
  <a href="kontak.html">Kontak</a>
</nav>

<div class="profil-wrapper">
  <div class="profil-card">
    <div class="profil-avatar" id="profilAvatar">?</div>
    <div class="profil-nama" id="profilNama">-</div>
    <div class="profil-hp" id="profilHp">-</div>

    <div class="sukses-msg" id="suksesMsg">✓ Profil berhasil diperbarui!</div>

    <label class="profil-label">Nama Lengkap</label>
    <input class="profil-input" type="text" id="editNama" placeholder="Nama lengkap">

    <label class="profil-label">Nomor HP</label>
    <input class="profil-input" type="tel" id="editHp" disabled style="background:#f5f5f5; color:#999;">

    <label class="profil-label">Kecamatan</label>
    <select class="profil-input" id="editKecamatan" onchange="isiKelurahanProfil()">
      <option value="">-- Pilih Kecamatan --</option>
      <option value="nusaniwe">Nusaniwe</option>
      <option value="sirimau">Sirimau</option>
      <option value="teluk ambon">Teluk Ambon</option>
      <option value="baguala">Baguala</option>
      <option value="leitimur selatan">Leitimur Selatan</option>
    </select>

    <label class="profil-label">Kelurahan</label>
    <select class="profil-input" id="editKelurahan">
      <option value="">-- Pilih Kelurahan --</option>
    </select>

    <label class="profil-label">Alamat Lengkap</label>
    <input class="profil-input" type="text" id="editAlamat" placeholder="Contoh: Jl. Pattimura No. 5">

    <button class="profil-btn" onclick="simpanProfil()">Simpan Perubahan</button>
    
    <!-- SECTION ALAMAT -->
<div class="profil-card" id="sectionAlamat">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div style="font-size:16px; font-weight:800; color:#1a3a1a;">Alamat Saya</div>
    <button onclick="bukaFormAlamat()" style="background:#2d6a2d; color:white; border:none; border-radius:8px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;">+ Tambah</button>
  </div>
  <div id="listAlamat">
    <div style="text-align:center; color:#aaa; font-size:13px; padding:20px 0;">Memuat alamat...</div>
  </div>
</div>

<!-- MODAL FORM ALAMAT -->
<div id="modalAlamat" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; padding:16px; box-sizing:border-box;">
  <div style="background:white; border-radius:20px; padding:24px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto;">
    <div style="font-size:16px; font-weight:800; color:#1a3a1a; margin-bottom:16px;" id="judulFormAlamat">Tambah Alamat</div>

    <label class="profil-label">Label (Rumah / Kantor / dll)</label>
    <input class="profil-input" type="text" id="alamatLabel" placeholder="Rumah">

    <label class="profil-label">Nama Penerima</label>
    <input class="profil-input" type="text" id="alamatNama" placeholder="Nama lengkap penerima">

    <label class="profil-label">Nomor HP Penerima</label>
    <input class="profil-input" type="tel" id="alamatHp" placeholder="081234567890">

    <label class="profil-label">Kecamatan</label>
    <select class="profil-input" id="alamatKecamatan" onchange="isiKelurahanAlamat()">
      <option value="">-- Pilih Kecamatan --</option>
      <option value="nusaniwe">Nusaniwe</option>
      <option value="sirimau">Sirimau</option>
      <option value="teluk ambon">Teluk Ambon</option>
      <option value="baguala">Baguala</option>
      <option value="leitimur selatan">Leitimur Selatan</option>
    </select>

    <label class="profil-label">Kelurahan</label>
    <select class="profil-input" id="alamatKelurahan">
      <option value="">-- Pilih Kelurahan --</option>
    </select>

    <label class="profil-label">Alamat Lengkap</label>
    <input class="profil-input" type="text" id="alamatDetail" placeholder="Jl. Pattimura No. 5">

    <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
      <input type="checkbox" id="alamatUtama" style="width:16px; height:16px;">
      <label style="font-size:13px; color:#555; cursor:pointer;" for="alamatUtama">Jadikan alamat utama</label>
    </div>

    <button onclick="simpanAlamatBaru()" class="profil-btn">Simpan Alamat</button>
    <button onclick="tutupFormAlamat()" class="profil-btn-logout" style="margin-top:8px;">Batal</button>
  </div>
</div>
    
    <button class="profil-btn-logout" onclick="logout()">Keluar</button>
  </div>
</div>

<script>

const API = 'https://bumi-kelapa-production-2a25.up.railway.app/auth.php';

// ===== LOAD ALAMAT =====
async function loadAlamat() {
  try {
    const res  = await fetch(`${API}?aksi=alamat_list&hp=${encodeURIComponent(user.hp)}`);
    const data = await res.json();
    renderAlamat(data.alamat || []);
  } catch(e) {
    document.getElementById('listAlamat').innerHTML = '<div style="color:#cc0000;font-size:13px;">Gagal memuat alamat.</div>';
  }
}

function renderAlamat(list) {
  const el = document.getElementById('listAlamat');
  if (!list.length) {
    el.innerHTML = '<div style="text-align:center;color:#aaa;font-size:13px;padding:20px 0;">Belum ada alamat tersimpan.</div>';
    return;
  }
  el.innerHTML = list.map(a => `
    <div style="border:1.5px solid ${a.is_utama?'#2d6a2d':'#e0ede0'}; border-radius:12px; padding:14px 16px; margin-bottom:12px; position:relative;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <span style="font-size:12px; font-weight:700; background:${a.is_utama?'#e8f5e9':'#f5f5f5'}; color:${a.is_utama?'#2d6a2d':'#888'}; padding:2px 10px; border-radius:20px;">${a.label||'Rumah'}</span>
        ${a.is_utama ? '<span style="font-size:11px;color:#2d6a2d;font-weight:700;">✓ Utama</span>' : ''}
      </div>
      <div style="font-size:14px; font-weight:700; color:#1a3a1a;">${a.nama_penerima}</div>
      <div style="font-size:12px; color:#888; margin:2px 0;">${a.no_hp||''}</div>
      <div style="font-size:12px; color:#555; margin-top:4px;">${a.alamat}, ${(a.kelurahan||'').replace(/\b\w/g,c=>c.toUpperCase())}, ${(a.kecamatan||'').replace(/\b\w/g,c=>c.toUpperCase())}</div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        ${!a.is_utama ? `<button onclick="jadikanUtama(${a.id})" style="font-size:11px;padding:4px 10px;border:1px solid #2d6a2d;color:#2d6a2d;background:white;border-radius:6px;cursor:pointer;">Jadikan Utama</button>` : ''}
        <button onclick="hapusAlamat(${a.id})" style="font-size:11px;padding:4px 10px;border:1px solid #ffcccc;color:#cc0000;background:white;border-radius:6px;cursor:pointer;">Hapus</button>
      </div>
    </div>
  `).join('');
}

function bukaFormAlamat() {
  document.getElementById('modalAlamat').style.display = 'flex';
  document.getElementById('alamatNama').value = user.nama || '';
  document.getElementById('alamatHp').value   = user.hp || '';
}

function tutupFormAlamat() {
  document.getElementById('modalAlamat').style.display = 'none';
}

function isiKelurahanAlamat() {
  const kec = document.getElementById('alamatKecamatan').value;
  const sel = document.getElementById('alamatKelurahan');
  sel.innerHTML = '<option value="">-- Pilih Kelurahan --</option>';
  (dataWilayah[kec]||[]).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k.replace(/\b\w/g,c=>c.toUpperCase());
    sel.appendChild(opt);
  });
}

async function simpanAlamatBaru() {
  const label         = document.getElementById('alamatLabel').value.trim() || 'Rumah';
  const nama_penerima = document.getElementById('alamatNama').value.trim();
  const no_hp         = document.getElementById('alamatHp').value.trim();
  const kecamatan     = document.getElementById('alamatKecamatan').value;
  const kelurahan     = document.getElementById('alamatKelurahan').value;
  const alamat        = document.getElementById('alamatDetail').value.trim();
  const is_utama      = document.getElementById('alamatUtama').checked ? 1 : 0;

  if (!nama_penerima || !alamat) { alert('Nama penerima dan alamat wajib diisi.'); return; }

  try {
    const res  = await fetch(`${API}?aksi=alamat_simpan`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ hp: user.hp, label, nama_penerima, no_hp, kecamatan, kelurahan, alamat, is_utama })
    });
    const data = await res.json();
    if (data.sukses) {
      tutupFormAlamat();
      loadAlamat();
    } else {
      alert(data.pesan);
    }
  } catch(e) {
    alert('Gagal menyimpan alamat.');
  }
}

async function hapusAlamat(id) {
  if (!confirm('Hapus alamat ini?')) return;
  await fetch(`${API}?aksi=alamat_hapus`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id, hp: user.hp })
  });
  loadAlamat();
}

async function jadikanUtama(id) {
  await fetch(`${API}?aksi=alamat_utama`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id, hp: user.hp })
  });
  loadAlamat();
}

// Load alamat saat halaman dibuka
loadAlamat();

const dataWilayah = {
  "nusaniwe":["latuhalat","seilale","amahusu","air salobar","nusaniwe","benteng","kudamati","wainitu","mangga dua","urimessing","waihaong","silale","wakasihu"],
  "sirimau":["honipopu","ahusen","batu meja","karang panjang","amantelu","rijali","uritetu","batu gajah","batu merah","pandan kasturi","galala","hative kecil","soya","waihoka"],
  "teluk ambon":["poka","rumah tiga","wayame","hative besar","hunuth","tawiri","laha","tihu"],
  "baguala":["halong","lateri","latta","nania","negeri lama","passo","waiheru"],
  "leitimur selatan":["kilang","hutumuri","naku","seri","eirene"]
};

function isiKelurahanProfil() {
  const kec = document.getElementById('editKecamatan').value;
  const sel = document.getElementById('editKelurahan');
  sel.innerHTML = '<option value="">-- Pilih Kelurahan --</option>';
  (dataWilayah[kec]||[]).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k.replace(/\b\w/g, c => c.toUpperCase());
    sel.appendChild(opt);
  });
}

// Load user dari localStorage
const user = JSON.parse(localStorage.getItem('bk_user') || 'null');
if (!user) {
  window.location.href = 'login.html';
} else {
  document.getElementById('profilAvatar').textContent = user.nama ? user.nama[0].toUpperCase() : '?';
  document.getElementById('profilNama').textContent = user.nama || '-';
  document.getElementById('profilHp').textContent = user.hp || '-';
  document.getElementById('editNama').value = user.nama || '';
  document.getElementById('editHp').value = user.hp || '';
  document.getElementById('editAlamat').value = user.alamat || '';

  if (user.kecamatan) {
    document.getElementById('editKecamatan').value = user.kecamatan;
    isiKelurahanProfil();
    setTimeout(() => {
      document.getElementById('editKelurahan').value = user.kelurahan || '';
    }, 100);
  }
}

async function simpanProfil() {
  const nama      = document.getElementById('editNama').value.trim();
  const kecamatan = document.getElementById('editKecamatan').value;
  const kelurahan = document.getElementById('editKelurahan').value;
  const alamat    = document.getElementById('editAlamat').value.trim();

  if (!nama) { alert('Nama wajib diisi.'); return; }

  try {
    const res = await fetch('https://bumi-kelapa-production-2a25.up.railway.app/auth.php?aksi=update', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ hp: user.hp, nama, kecamatan, kelurahan, alamat })
    });
    const data = await res.json();
    if (data.sukses) {
      const updated = {...user, nama, kecamatan, kelurahan, alamat};
      localStorage.setItem('bk_user', JSON.stringify(updated));
      document.getElementById('profilAvatar').textContent = nama[0].toUpperCase();
      document.getElementById('profilNama').textContent = nama;
      const msg = document.getElementById('suksesMsg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    }
  } catch(e) {
    alert('Gagal menyimpan.');
  }
}

function logout() {
  localStorage.removeItem('bk_user');
 fetch('https://bumi-kelapa-production-2a25.up.railway.app/auth.php?aksi=logout');
  window.location.href = 'produk.html';
}
</script>
</body>
</html>

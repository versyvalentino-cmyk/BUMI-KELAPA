<style>
/* ===== NAVIGASI DESKTOP + MOBILE ===== */
nav {
    background: #fff;
    border-top: 1px solid #ddd;
    border-bottom: 3px solid #2d6a2d;
    padding: 14px 0;
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    justify-content: center;     /* Tengah di desktop */
    gap: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

nav::-webkit-scrollbar {
    display: none;
}

nav a {
    flex-shrink: 0;
    padding: 10px 18px;
    color: #333;
    text-decoration: none;
    font-weight: 500;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.2s;
}

nav a:hover {
    background: #f0f8f0;
    color: #2d6a2d;
}

nav a.active {
    color: #2d6a2d;
    font-weight: 700;
    background: #f0f8f0;
    border-bottom: 3px solid #2d6a2d;
}

/* Mobile Optimization */
@media (max-width: 768px) {
    nav {
        justify-content: flex-start;   /* Scroll di HP */
        padding: 10px 0;
        padding-left: 10px;
    }
    nav a {
        padding: 9px 14px;
        font-size: 13.8px;
    }
}
</style>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Bumi Kelapa</title>

<style>
/* ===== MOBILE ONLY ===== */
@media (max-width: 768px) {

  header {
    padding: 12px 16px !important;
    min-height: 70px !important;
  }

  header img {
    height: 70px !important;
    width: auto !important;
  }

  /* Navigasi Mobile */
  nav {
    background: white !important;
    border-top: 1px solid #ddd !important;
    border-bottom: 1px solid #ddd !important;
    padding: 12px 0 !important;
    overflow-x: auto !important;
    white-space: nowrap;
    display: flex !important;
    gap: 8px !important;
    scrollbar-width: none;
  }

  nav::-webkit-scrollbar { display: none; }

  nav a {
    flex-shrink: 0 !important;
    padding: 10px 14px !important;
    font-size: 13.5px !important;
    color: #333 !important;
    text-decoration: none !important;
    font-weight: 500;
    border-radius: 8px;
  }

  nav a.active {

    font-weight: 700 !important;
    background: #f0f8f0 !important;
    border-bottom: 3px solid #2d6a2d !important;
  }

  .galeri-header, .container {
    padding: 0 16px !important;
    margin: 0 !important;
    width: 100% !important;
    box-sizing: border-box !important;
  }

  .galeri-grid {
    padding: 0 8px !important;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) !important;
    gap: 16px !important;
  }

  .galeri-card {
    margin: 0 !important;
  }
}
</style>

<body>

<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); 
               padding: 12px 16px; 
               display: flex; 
               align-items: center; 
               justify-content: center; 
               min-height: 80px;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 80px;">
  </div>
</header>

<nav>
  <a href="index.html">Beranda</a>
  <a href="produk.html" class="active">Produk</a>
  <a href="galeri.html">Galeri</a>
  <a href="tentang.html">Tentang Kami</a>
  <a href="kontak.html">Kontak</a>
</nav>

<div class="galeri-header">
  <h2>Galeri Produk</h2>
  <p>Berikut adalah beberapa produk utama yang tersedia di Bumi Kelapa.</p>
</div>

<div class="galeri-grid">

  <div class="galeri-card" onclick="buka360()">
    <div class="galeri-badge">360°</div>
    <img src="images360/kelapa1.jpeg" alt="Kelapa">
    <div class="galeri-card-info">
      <h3>Kelapa Sudah Dikupas</h3>
      <p>Klik untuk lihat tampilan 360°</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/sabut.jpg" alt="Sabut Kelapa">
    <div class="galeri-card-info">
      <h3>Sabut Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/tempurung.jpg" alt="Tempurung Kelapa">
    <div class="galeri-card-info">
      <h3>Tempurung Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

</div>

<!-- MODAL GAMBAR BESAR -->
<div id="modalGambar" onclick="tutupModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
  <img id="modalImg" style="max-width:85%; max-height:85vh; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
  <div style="position:absolute; top:20px; right:30px; color:white; font-size:36px; cursor:pointer; font-weight:300;">✕</div>
</div>

<!-- MODAL 360 -->
<div id="modal360" class="modal" style="display:none;">
  <span class="close" onclick="tutup360()">&times;</span>
  <div class="viewer360" id="viewer">
    <img id="img360" src="images360/kelapa1.jpeg" draggable="false">
    <div class="hint-360" id="hint360">Geser untuk memutar</div>
  </div>
</div>

<script>
// Script modal gambar & 360 tetap sama seperti kode kamu
function lihatGambar(img) {
  const modal = document.getElementById('modalGambar');
  document.getElementById('modalImg').src = img.src;
  modal.style.display = 'flex';
}
function tutupModal() {
  document.getElementById('modalGambar').style.display = 'none';
}

let current360 = 1;
const total360 = 6;

function buka360() {
  current360 = 1;
  document.getElementById('img360').src = 'images360/kelapa' + current360 + '.jpeg';
  document.getElementById('modal360').style.display = 'block';
  
  const hint = document.getElementById('hint360');
  hint.style.animation = 'none';
  hint.style.opacity = '1';
  setTimeout(() => { hint.style.animation = 'fadeHint 3s ease forwards'; }, 50);
}

function tutup360() {
  document.getElementById('modal360').style.display = 'none';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { tutupModal(); tutup360(); }
});

window.onclick = function(e) {
  if (e.target == document.getElementById('modal360')) tutup360();
};

// 360 rotation script (tetap sama)
document.addEventListener("DOMContentLoaded", function() {
  const img = document.getElementById("img360");
  const viewer = document.getElementById("viewer");
  const TOTAL = 6;
  const SENSITIVITY = 8;
  let isDown = false, startX = 0, accumX = 0;

  function gantiFrame(arah) {
    current360 += arah;
    if (current360 < 1) current360 = TOTAL;
    if (current360 > TOTAL) current360 = 1;
    img.style.opacity = '0.75';
    img.src = "images360/kelapa" + current360 + ".jpeg";
    requestAnimationFrame(() => img.style.opacity = '1');
  }

  // Mouse & Touch script tetap seperti aslinya...
  // (saya tidak ubah bagian ini agar tidak rusak)
  // ... (paste seluruh script 360 kamu di sini jika perlu)
});
</script>

<script>
// Nav transition script
document.querySelectorAll('nav a').forEach(link => {
  link.addEventListener('click', function(e) {
    const href = this.getAttribute('href');
    if (!href || href.startsWith('#')) return;
    e.preventDefault();
    const pages = ['index.html', 'produk.html', 'galeri.html', 'tentang.html', 'kontak.html'];
    const currentPage = location.pathname.split('/').pop() || 'index.html';
    const currentIndex = pages.indexOf(currentPage);
    const targetIndex  = pages.indexOf(href);
    const direction    = targetIndex > currentIndex ? '-40px' : '40px';

    document.body.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
    document.body.style.opacity    = '0';
    document.body.style.transform  = `translateX(${direction}) scale(0.98)`;

    setTimeout(() => { window.location.href = href; }, 180);
  });
});
</script>

</body>
</html>

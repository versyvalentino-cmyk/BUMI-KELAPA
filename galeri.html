<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Bumi Kelapa</title>
    <link rel="stylesheet" href="style.css">

<style>
/* ===== MOBILE ONLY ===== */
@media (max-width: 768px) {

  header {
    padding: 12px 16px !important;
    min-height: 70px !important;
  }

  header img {
    height: 70px !important;
    width: auto !important;
  }

  /* Navigasi Mobile - Diperkuat */
  nav {
    background: white !important;
    border-top: 1px solid #ddd !important;
    border-bottom: 2px solid #2d6a2d !important;
    padding: 12px 0 !important;
    overflow-x: auto !important;
    white-space: nowrap;
    display: flex !important;
    gap: 8px !important;
    scrollbar-width: none;
  }

  nav::-webkit-scrollbar { display: none; }

  nav a {
    flex-shrink: 0 !important;
    padding: 12px 16px !important;
    font-size: 13.5px !important;
    color: #333 !important;
    text-decoration: none !important;
    font-weight: 500;
    border-radius: 8px;
  }

  nav a.active {
    color: #2d6a2d !important;
    font-weight: 700 !important;
    background: #f0f8f0 !important;
    border-bottom: 3px solid #2d6a2d !important;
  }

  .galeri-header, .container {
    padding: 0 16px !important;
  }

  .galeri-grid {
    padding: 0 8px !important;
    gap: 16px !important;
  }

  /* 360 Viewer */
  #viewer {
    height: 420px !important;
    width: 100% !important;
    touch-action: pan-y !important;
  }

  .galeri-badge {
    background: linear-gradient(135deg, #2d6a2d, #c8b87a) !important;
    color: white !important;
    font-size: 13px !important;
    padding: 6px 12px !important;
    border-radius: 20px !important;
    font-weight: 700 !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
}

  #viewer {
    width: 100% !important;
    max-width: 100% !important;
    height: 380px !important;
    touch-action: pan-y !important;
  }

  #img360 {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
  }

</style>

</head>

<body>

<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); 
               padding: 12px 16px; 
               display: flex; 
               align-items: center; 
               justify-content: center; 
               min-height: 80px;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 80px;">
  </div>
</header>

<nav style="background:#fff !important; border-top:1px solid #ddd !important; border-bottom:2px solid #2d6a2d !important; padding:12px 0 !important; overflow-x:auto !important; white-space:nowrap; display:flex !important; gap:8px;">
  <a href="index.html" style="padding:10px 16px; color:#333; text-decoration:none; font-weight:500;">Beranda</a>
  <a href="produk.html" style="padding:10px 16px; color:#333; text-decoration:none; font-weight:500;">Produk</a>
  <a href="galeri.html" class="active" style="padding:10px 16px; color:#2d6a2d; text-decoration:none; font-weight:700; border-bottom:3px solid #2d6a2d;">Galeri</a>
  <a href="tentang.html" style="padding:10px 16px; color:#333; text-decoration:none; font-weight:500;">Tentang Kami</a>
  <a href="kontak.html" style="padding:10px 16px; color:#333; text-decoration:none; font-weight:500;">Kontak</a>
</nav>

<div class="galeri-header">
  <h2>Galeri Produk</h2>
  <p>Berikut adalah beberapa produk utama yang tersedia di Bumi Kelapa.</p>
</div>

<div class="galeri-grid">

  <div class="galeri-card" onclick="buka360()">
    <div class="galeri-badge">360°</div>
    <img src="images360/kelapa1.jpeg" alt="Kelapa">
    <div class="galeri-card-info">
      <h3>Kelapa Sudah Dikupas</h3>
      <p>Klik untuk lihat tampilan 360°</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/sabut.jpg" alt="Sabut Kelapa">
    <div class="galeri-card-info">
      <h3>Sabut Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/tempurung.jpg" alt="Tempurung Kelapa">
    <div class="galeri-card-info">
      <h3>Tempurung Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

</div>

<!-- MODAL GAMBAR BESAR -->
<div id="modalGambar" onclick="tutupModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;">
  <img id="modalImg" style="max-width:90%; max-height:85vh; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
  <div style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer;">✕</div>
</div>

<!-- MODAL 360 -->
<div id="modal360" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; align-items:center; justify-content:center;">
  <span onclick="tutup360()" style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer; z-index:10;">✕</span>
  <div id="viewer" style="width:94%; max-width:500px; height:420px; background:#111; border-radius:12px; overflow:hidden; cursor:grab;">
    <img id="img360" src="images360/kelapa1.jpeg" draggable="false" style="width:100%; height:100%; object-fit:contain;">
    <div class="hint-360" id="hint360">👆 Geser untuk memutar</div>
  </div>
</div>

<script>
// Modal biasa
function lihatGambar(img) {
  document.getElementById('modalImg').src = img.src;
  document.getElementById('modalGambar').style.display = 'flex';
}
function tutupModal() {
  document.getElementById('modalGambar').style.display = 'none';
}

// 360° Viewer
let current360 = 1;
const total360 = 6;

function buka360() {
  current360 = 1;
  document.getElementById('img360').src = `images360/kelapa${current360}.jpeg`;
  document.getElementById('modal360').style.display = 'flex';
  
  const hint = document.getElementById('hint360');
  hint.style.opacity = '1';
}

function tutup360() {
  document.getElementById('modal360').style.display = 'none';
}

// Script 360° - Diperbaiki
document.addEventListener("DOMContentLoaded", function() {
  const img = document.getElementById("img360");
  const viewer = document.getElementById("viewer");
  let isDragging = false;
  let startX = 0;
  let accumX = 0;
  const SENSITIVITY = 10;

  function gantiFrame(arah) {
    current360 += arah;
    if (current360 < 1) current360 = total360;
    if (current360 > total360) current360 = 1;
    
    img.style.opacity = "0.7";
    img.src = `images360/kelapa${current360}.jpeg`;
    setTimeout(() => img.style.opacity = "1", 50);
  }

  // Mouse Drag
  viewer.addEventListener("mousedown", e => {
    isDragging = true;
    startX = e.clientX;
    viewer.style.cursor = "grabbing";
  });

  document.addEventListener("mouseup", () => {
    isDragging = false;
    viewer.style.cursor = "grab";
  });

  document.addEventListener("mousemove", e => {
    if (!isDragging) return;
    const delta = e.clientX - startX;
    startX = e.clientX;
    accumX += delta;

    while (accumX >= SENSITIVITY) {
      gantiFrame(-1);
      accumX -= SENSITIVITY;
    }
    while (accumX <= -SENSITIVITY) {
      gantiFrame(1);
      accumX += SENSITIVITY;
    }
  });

  // Touch Swipe (HP)
  viewer.addEventListener("touchstart", e => {
    isDragging = true;
    startX = e.touches[0].clientX;
    accumX = 0;
  }, { passive: true });

  viewer.addEventListener("touchmove", e => {
    if (!isDragging) return;
    const delta = e.touches[0].clientX - startX;
    startX = e.touches[0].clientX;
    accumX += delta;

    while (accumX >= SENSITIVITY) {
      gantiFrame(-1);
      accumX -= SENSITIVITY;
    }
    while (accumX <= -SENSITIVITY) {
      gantiFrame(1);
      accumX += SENSITIVITY;
    }
  }, { passive: false });

  viewer.addEventListener("touchend", () => isDragging = false);
});

// Nav transition
document.querySelectorAll('nav a').forEach(link => {
  link.addEventListener('click', function(e) {
    const href = this.getAttribute('href');
    if (!href || href.startsWith('#')) return;
    e.preventDefault();
    const pages = ['index.html', 'produk.html', 'galeri.html', 'tentang.html', 'kontak.html'];
    const currentPage = location.pathname.split('/').pop() || 'index.html';
    const currentIndex = pages.indexOf(currentPage);
    const targetIndex  = pages.indexOf(href);
    const direction    = targetIndex > currentIndex ? '-40px' : '40px';

    document.body.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
    document.body.style.opacity = '0';
    document.body.style.transform = `translateX(${direction}) scale(0.98)`;

    setTimeout(() => window.location.href = href, 180);
  });
});
</script>

</body>
</html>

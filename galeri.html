<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri - Bumi Kelapa</title>
<link rel="stylesheet" href="style.css">
<style>
@keyframes zoomIn {
  from { transform: scale(0.8); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.galeri-badge {
  position: absolute;
  top: 12px; left: 12px;
  background: linear-gradient(135deg, #2d6a2d, #c8b87a);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 1px;
  z-index: 2;
}

/* 360 Viewer */
#img360 {
  transition: opacity 0.06s ease;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  width: 100%;
  max-height: 80vh;
  object-fit: contain;
  display: block;
}
#viewer {
  cursor: grab;
  user-select: none;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: #111;
}
#viewer:active { cursor: grabbing; }

/* Hint rotate */
.hint-360 {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: fadeHint 3s ease forwards;
  white-space: nowrap;
}
@keyframes fadeHint {
  0%   { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}

/* Frame counter */
.frame-counter {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  pointer-events: none;
}


header {
  background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%) !important;
  padding: 12px 16px !important;
  min-height: 65px !important;
  height: auto !important;
  overflow: visible !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

header img {
  height: 55px !important;
  width: auto !important;
  max-height: 55px !important;
}

nav {
  display: flex !important;
  overflow-x: auto !important;
  white-space: nowrap !important;
  padding: 0 !important;
  justify-content: flex-start !important;
}

nav a {
  flex-shrink: 0 !important;
  padding: 12px 14px !important;
  font-size: 11px !important;
  white-space: nowrap !important;
}

nav {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  background: #ffffff !important;
  border-bottom: 3px solid #2d6a2d !important;
  padding: 0 !important;
  overflow-x: auto !important;
  white-space: nowrap !important;
  height: auto !important;
  min-height: 48px !important;
}

nav a {
  display: inline-flex !important;
  align-items: center !important;
  flex-shrink: 0 !important;
  padding: 14px 18px !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  color: #2c2c2c !important;
  text-decoration: none !important;
  white-space: nowrap !important;
  letter-spacing: 1px !important;
  text-transform: uppercase !important;
}

nav a {
  font-weight: 800 !important;
  letter-spacing: 1.5px !important;
}

@media (min-width: 769px) {
  nav {
    justify-content: center !important;
  }
}

</style>



</head>
<body>

<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); padding: 14px 24px; display: flex; align-items: center; justify-content: center; min-height: 70px; height: auto;">
  <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 70px !important; width: auto !important; object-fit: contain !important;">
</header>



<nav>
  <a href="index.html">Beranda</a>
  <a href="produk.html">Produk</a>
  <a href="galeri.html" class="active">Galeri</a>
  <a href="tentang.html">Tentang Kami</a>
  <a href="kontak.html">Kontak</a>
</nav>

<div class="galeri-header">
  <h2>Galeri Produk</h2>
  <p>Berikut adalah beberapa produk utama yang tersedia di Bumi Kelapa.</p>
</div>

<div class="galeri-grid">

  <div class="galeri-card" onclick="buka360()">
    <div class="galeri-badge">360°</div>
    <img src="images360/kelapa1.jpeg" alt="Kelapa">
    <div class="galeri-card-info">
      <h3>Kelapa Sudah Dikupas</h3>
      <p>Klik untuk lihat tampilan 360°</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/sabut.jpg" alt="Sabut Kelapa">
    <div class="galeri-card-info">
      <h3>Sabut Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/tempurung.jpg" alt="Tempurung Kelapa">
    <div class="galeri-card-info">
      <h3>Tempurung Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

</div>

<!-- MODAL GAMBAR BESAR -->
<div id="modalGambar" onclick="tutupModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
  <img id="modalImg" style="max-width:85%; max-height:85vh; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
  <div style="position:absolute; top:20px; right:30px; color:white; font-size:36px; cursor:pointer; font-weight:300;">✕</div>
</div>

<!-- MODAL 360 -->
<div id="modal360" class="modal">
  <span class="close" onclick="tutup360()">&times;</span>
  <div class="viewer360" id="viewer">
    <img id="img360" src="images360/kelapa1.jpeg" draggable="false">
    <div class="hint-360" id="hint360"> Geser untuk memutar</div>
    <div class="frame-counter" id="frameCounter">1 / 6</div>
  </div>
</div>

<script>
// ===== MODAL GAMBAR =====
function lihatGambar(img) {
  const modal = document.getElementById('modalGambar');
  document.getElementById('modalImg').src = img.src;
  modal.style.display = 'flex';
}
function tutupModal() {
  document.getElementById('modalGambar').style.display = 'none';
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { tutupModal(); tutup360(); }
});

// ===== MODAL 360 =====
let current360 = 1;
const total360 = 6;

function buka360() {
  current360 = 1;
  document.getElementById('img360').src = 'images360/kelapa' + current360 + '.jpeg';
  document.getElementById('frameCounter').textContent = current360 + ' / ' + total360;
  document.getElementById('modal360').style.display = 'block';

  // Tampilkan hint lagi setiap buka
  const hint = document.getElementById('hint360');
  hint.style.animation = 'none';
  hint.style.opacity = '1';
  setTimeout(() => { hint.style.animation = 'fadeHint 3s ease forwards'; }, 50);
}

function tutup360() {
  document.getElementById('modal360').style.display = 'none';
}

window.onclick = function(e) {
  if (e.target == document.getElementById('modal360')) tutup360();
}

// ===== 360 SMOOTH ROTATION =====
document.addEventListener("DOMContentLoaded", function() {
  const img     = document.getElementById("img360");
  const viewer  = document.getElementById("viewer");
  const counter = document.getElementById("frameCounter");
  const TOTAL   = 6;
  const SENSITIVITY = 2; // px per frame — makin kecil makin sensitif & smooth

  let isDown   = false;
  let startX   = 0;
  let accumX   = 0;

  function gantiFrame(arah) {
    current360 += arah;
    if (current360 < 1)     current360 = TOTAL;
    if (current360 > TOTAL) current360 = 1;

    // Fade tipis agar transisi smooth
    img.style.opacity = '0.75';
    img.src = "images360/kelapa" + current360 + ".jpeg";
    counter.textContent = current360 + ' / ' + TOTAL;
    requestAnimationFrame(() => {
      img.style.opacity = '1';
    });
  }

  // ---- MOUSE ----
  viewer.addEventListener("mousedown", function(e) {
    isDown = true;
    startX = e.clientX;
    accumX = 0;
    viewer.style.cursor = 'grabbing';
    e.preventDefault();
  });

  document.addEventListener("mouseup", function() {
    if (isDown) {
      isDown = false;
      viewer.style.cursor = 'grab';
    }
  });

  document.addEventListener("mousemove", function(e) {
    if (!isDown) return;
    const delta = e.clientX - startX;
    startX  = e.clientX;
    accumX += delta;

    while (accumX >= SENSITIVITY) {
      gantiFrame(-1);
      accumX -= SENSITIVITY;
    }
    while (accumX <= -SENSITIVITY) {
      gantiFrame(1);
      accumX += SENSITIVITY;
    }
  });

  // ---- TOUCH (HP) ----
  let startTouch  = 0;
  let accumTouch  = 0;
  let lastTouch   = 0;
  let velocity    = 0;
  let momentumTimer = null;

  viewer.addEventListener("touchstart", function(e) {
    startTouch = e.touches[0].clientX;
    lastTouch  = startTouch;
    accumTouch = 0;
    velocity   = 0;
    if (momentumTimer) clearInterval(momentumTimer);
  }, { passive: true });

  viewer.addEventListener("touchmove", function(e) {
    e.preventDefault();
    const touchX = e.touches[0].clientX;
    const delta  = touchX - lastTouch;
    lastTouch    = touchX;
    velocity     = delta;
    accumTouch  += delta;

    while (accumTouch >= SENSITIVITY) {
      gantiFrame(-1);
      accumTouch -= SENSITIVITY;
    }
    while (accumTouch <= -SENSITIVITY) {
      gantiFrame(1);
      accumTouch += SENSITIVITY;
    }
  }, { passive: false });

  viewer.addEventListener("touchend", function() {
    // Momentum setelah lepas sentuhan
    let v = velocity;
    if (Math.abs(v) < 2) return;

    momentumTimer = setInterval(() => {
      v *= 0.85; // friction
      accumTouch += v;

      while (accumTouch >= SENSITIVITY) {
        gantiFrame(-1);
        accumTouch -= SENSITIVITY;
      }
      while (accumTouch <= -SENSITIVITY) {
        gantiFrame(1);
        accumTouch += SENSITIVITY;
      }

      if (Math.abs(v) < 0.3) clearInterval(momentumTimer);
    }, 16); // ~60fps
  }, { passive: true });
});
</script>

</body>
</html>

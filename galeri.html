<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Bumi Kelapa</title>
    <link rel="stylesheet" href="style.css">

<style>
/* ===== MOBILE ONLY — TIDAK MEMPENGARUHI LAPTOP ===== */
@media (max-width: 768px) {

  header {
    padding: 12px 16px !important;
    min-height: 70px !important;
  }

  header img {
    height: 70px !important;
    width: auto !important;
  }

  /* Navigasi Mobile */
  nav {
    background: white !important;
    border-top: 1px solid #ddd !important;
    border-bottom: 2px solid #2d6a2d !important;
    padding: 12px 0 !important;
    overflow-x: auto !important;
    white-space: nowrap;
    display: flex !important;
    gap: 8px !important;
  }

  nav::-webkit-scrollbar { display: none; }

  nav a {
    flex-shrink: 0 !important;
    padding: 12px 16px !important;
    font-size: 13.5px !important;
    color: #333 !important;
    text-decoration: none;
    font-weight: 500;
    border-radius: 8px;
  }

  nav a.active {
    color: #2d6a2d !important;
    font-weight: 700 !important;
    background: #f0f8f0 !important;
    border-bottom: 3px solid #2d6a2d !important;
  }

  /* 360 Viewer Mobile */
  #viewer {
    height: 420px !important;
  }

  .galeri-badge {
    background: linear-gradient(135deg, #2d6a2d, #c8b87a) !important;
    color: white !important;
    padding: 6px 12px !important;
    border-radius: 20px !important;
    font-weight: 700 !important;
  }
}
</style>

</head>

<body>

<header style="background: linear-gradient(135deg, #2d6a2d 0%, #143d14 100%); 
               padding: 16px 32px; 
               display: flex; 
               align-items: center; 
               justify-content: space-between; 
               min-height: 80px;">

  <div style="display: flex; align-items: center; gap: 10px;">
    <img src="logo/NEW.png" alt="Bumi Kelapa" style="height: 215px;">
  </div>
</header>

<nav>
  <a href="index.html">Beranda</a>
  <a href="produk.html">Produk</a>
  <a href="galeri.html" class="active">Galeri</a>
  <a href="tentang.html">Tentang Kami</a>
  <a href="kontak.html">Kontak</a>
</nav>

<div class="galeri-header">
  <h2>Galeri Produk</h2>
  <p>Berikut adalah beberapa produk utama yang tersedia di Bumi Kelapa.</p>
</div>

<div class="galeri-grid">

  <div class="galeri-card" onclick="buka360()">
    <div class="galeri-badge">360°</div>
    <img src="images360/kelapa1.jpeg" alt="Kelapa">
    <div class="galeri-card-info">
      <h3>Kelapa Sudah Dikupas</h3>
      <p>Klik untuk lihat tampilan 360°</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/sabut.jpg" alt="Sabut Kelapa">
    <div class="galeri-card-info">
      <h3>Sabut Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

  <div class="galeri-card" onclick="lihatGambar(this.querySelector('img'))">
    <img src="images/tempurung.jpg" alt="Tempurung Kelapa">
    <div class="galeri-card-info">
      <h3>Tempurung Kelapa</h3>
      <p>Klik untuk perbesar</p>
    </div>
  </div>

</div>

<!-- MODAL 360 -->
<div id="modal360" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; align-items:center; justify-content:center;">
  <span onclick="tutup360()" style="position:absolute; top:25px; right:25px; color:white; font-size:40px; cursor:pointer; z-index:10;">✕</span>
  <div id="viewer" style="width:92%; max-width:520px; height:440px; background:#111; border-radius:16px; overflow:hidden; cursor:grab;">
    <img id="img360" src="images360/kelapa1.jpeg" draggable="false" style="width:100%; height:100%; object-fit:contain;">
    <div id="hint360" style="position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:8px 16px; border-radius:30px; font-size:13px;">👆 Geser untuk memutar</div>
  </div>
</div>

<script>
// 360° Viewer - Versi Final (Smooth & Tanpa Flash)
let current360 = 1;
const total360 = 6;

function buka360() {
  current360 = 1;
  document.getElementById('img360').src = `images360/kelapa${current360}.jpeg`;
  document.getElementById('modal360').style.display = 'flex';
}

function tutup360() {
  document.getElementById('modal360').style.display = 'none';
}

document.addEventListener("DOMContentLoaded", function() {
  const img = document.getElementById("img360");
  const viewer = document.getElementById("viewer");
  let isDragging = false;
  let startX = 0;
  let accum = 0;
  const sensitivity = 22;   // Kecepatan ideal (tidak terlalu cepat)

  function gantiFrame(dir) {
    current360 += dir;
    if (current360 < 1) current360 = total360;
    if (current360 > total360) current360 = 1;
    
    // Tanpa efek flash gelap-terang
    img.src = `images360/kelapa${current360}.jpeg`;
  }

  // Mouse Drag (Laptop)
  viewer.addEventListener("mousedown", e => {
    isDragging = true;
    startX = e.clientX;
    accum = 0;
  });

  document.addEventListener("mouseup", () => isDragging = false);
  document.addEventListener("mousemove", e => {
    if (!isDragging) return;
    const delta = e.clientX - startX;
    startX = e.clientX;
    accum += delta;

    while (accum >= sensitivity) { 
      gantiFrame(-1); 
      accum -= sensitivity; 
    }
    while (accum <= -sensitivity) { 
      gantiFrame(1); 
      accum += sensitivity; 
    }
  });

  // Touch Swipe (HP)
  viewer.addEventListener("touchstart", e => {
    isDragging = true;
    startX = e.touches[0].clientX;
    accum = 0;
  }, {passive: true});

  viewer.addEventListener("touchmove", e => {
    if (!isDragging) return;
    const delta = e.touches[0].clientX - startX;
    startX = e.touches[0].clientX;
    accum += delta;

    while (accum >= sensitivity) { 
      gantiFrame(-1); 
      accum -= sensitivity; 
    }
    while (accum <= -sensitivity) { 
      gantiFrame(1); 
      accum += sensitivity; 
    }
  }, {passive: false});

  viewer.addEventListener("touchend", () => isDragging = false);
});
</script>

<script>
// Modal Gambar Biasa (Sabut & Tempurung)
function lihatGambar(img) {
  document.getElementById('modalImg').src = img.src;
  document.getElementById('modalGambar').style.display = 'flex';
}

function tutupModal() {
  document.getElementById('modalGambar').style.display = 'none';
}
</script>

<!-- MODAL GAMBAR BESAR (Sabut & Tempurung) -->
<div id="modalGambar" onclick="tutupModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;">
  <img id="modalImg" style="max-width:90%; max-height:85vh; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.6);">
  <div onclick="tutupModal()" style="position:absolute; top:20px; right:25px; color:white; font-size:40px; cursor:pointer; z-index:10;">✕</div>
</div>


</body>
</html>
